<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f23"/>
      <stop offset="50%" stop-color="#111130"/>
      <stop offset="100%" stop-color="#0a0a1e"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="15%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="85%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g stroke="#1a1a3e" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
  </g>
  <!-- Icon (scaled down version) -->
  <g transform="translate(80, 40) scale(0.47)">
    <!-- Document page -->
    <rect x="168" y="120" width="176" height="228" rx="8" fill="#1e2040" stroke="#2d3060" stroke-width="4"/>
    <path d="M304 120 L344 120 L344 160 Z" fill="#2d3060"/>
    <path d="M304 120 L304 160 L344 160" fill="none" stroke="#3b4080" stroke-width="3"/>
    <!-- Document text lines -->
    <rect x="192" y="168" width="104" height="6" rx="3" fill="#2d3060"/>
    <rect x="192" y="188" width="80" height="6" rx="3" fill="#2d3060"/>
    <rect x="192" y="208" width="96" height="6" rx="3" fill="#2d3060"/>
    <rect x="192" y="228" width="64" height="6" rx="3" fill="#2d3060"/>
    <rect x="192" y="268" width="104" height="6" rx="3" fill="#2d3060"/>
    <rect x="192" y="288" width="88" height="6" rx="3" fill="#2d3060"/>
    <!-- Camera viewfinder brackets -->
    <g stroke="#3b82f6" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M100 168 L100 108 L160 108"/>
      <path d="M352 108 L412 108 L412 168"/>
      <path d="M100 344 L100 404 L160 404"/>
      <path d="M352 404 L412 404 L412 344"/>
    </g>
    <!-- Scan line -->
    <rect x="112" y="304" width="288" height="3" rx="1.5" fill="url(#scan)"/>
    <rect x="112" y="302" width="288" height="7" rx="3.5" fill="#3b82f6" opacity="0.2"/>
    <!-- Camera lens -->
    <circle cx="256" cy="64" r="16" fill="none" stroke="#3b82f6" stroke-width="5" opacity="0.5"/>
    <circle cx="256" cy="64" r="6" fill="#3b82f6" opacity="0.5"/>
  </g>
  <!-- Title text -->
  <text x="380" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">
    ESP<tspan fill="#3b82f6">Scan</tspan>Cam
  </text>
  <!-- Subtitle -->
  <text x="383" y="198" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#6b7294" letter-spacing="3">
    SELF-HOSTED DOCUMENT SCANNER
  </text>
  <!-- Feature badges -->
  <g transform="translate(383, 225)">
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#1e2040" stroke="#2d3060" stroke-width="1"/>
    <text x="55" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">ESP32-CAM</text>
    <rect x="120" y="0" width="80" height="28" rx="14" fill="#1e2040" stroke="#2d3060" stroke-width="1"/>
    <text x="160" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">FastAPI</text>
    <rect x="210" y="0" width="80" height="28" rx="14" fill="#1e2040" stroke="#2d3060" stroke-width="1"/>
    <text x="250" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">React 18</text>
    <rect x="300" y="0" width="80" height="28" rx="14" fill="#1e2040" stroke="#2d3060" stroke-width="1"/>
    <text x="340" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">OpenCV</text>
    <rect x="390" y="0" width="80" height="28" rx="14" fill="#1e2040" stroke="#2d3060" stroke-width="1"/>
    <text x="430" y="19" font-family="system-ui, sans-serif" font-size="12" fill="#60a5fa" text-anchor="middle">Docker</text>
  </g>
  <!-- Decorative scan lines on the right -->
  <g opacity="0.15">
    <rect x="900" y="60" width="300" height="2" rx="1" fill="#3b82f6"/>
    <rect x="950" y="90" width="250" height="2" rx="1" fill="#3b82f6"/>
    <rect x="920" y="120" width="280" height="2" rx="1" fill="#3b82f6"/>
    <rect x="960" y="150" width="240" height="2" rx="1" fill="#3b82f6"/>
    <rect x="900" y="180" width="300" height="2" rx="1" fill="#3b82f6"/>
    <rect x="940" y="210" width="260" height="2" rx="1" fill="#3b82f6"/>
    <rect x="910" y="240" width="290" height="2" rx="1" fill="#3b82f6"/>
  </g>
</svg>
